<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat con Aprendizaje - Lia</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
      color: #2a1432;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 12px;
    }

    #version {
      font-size: 0.85em;
      color: #6a1b9a;
      font-weight: 700;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 1.4em;
      color: #8e24aa;
      text-shadow: 0 1px 3px rgba(243, 229, 245, 0.8);
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #7b1fa2;
      font-size: 0.9em;
      opacity: 0.9;
      margin-bottom: 16px;
      text-align: center;
    }

    #chat-box {
      width: 100%;
      max-width: 440px;
      height: 62vh;
      background: #ffffff;
      border-radius: 16px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(106, 27, 154, 0.12);
      scroll-behavior: smooth;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 80%;
      word-break: break-word;
      line-height: 1.45;
      font-size: 0.95em;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
    }

    .user {
      background: #8e24aa;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .lia {
      background: #f3e5f5;
      color: #3d176a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #e1bee7;
    }

    .typing {
      background: #f5f5f5;
      color: #888;
      align-self: flex-start;
      font-style: italic;
      border-bottom-left-radius: 4px;
    }

    .lia a {
      color: #6a1b9a;
      font-weight: bold;
      text-decoration: underline;
    }

    #inputArea {
      margin-top: 12px;
      display: flex;
      width: 100%;
      max-width: 440px;
      gap: 8px;
    }

    #user-input {
      flex-grow: 1;
      padding: 10px 16px;
      border: 2px solid #ce93d8;
      border-radius: 20px;
      font-size: 0.95em;
      background: #fff;
      color: #2a1432;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input:focus {
      border-color: #8e24aa;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 0 16px;
      height: 42px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9em;
      transition: opacity 0.2s, transform 0.1s;
      color: #fff;
    }

    button:active {
      transform: scale(0.97);
    }

    #send-btn {
      background: #8e24aa;
      box-shadow: 0 3px 8px rgba(142, 36, 170, 0.3);
    }

    #send-btn:hover {
      background: #7b1fa2;
    }

    #clear-btn {
      background: #e53935;
      box-shadow: 0 3px 8px rgba(229, 57, 53, 0.3);
    }

    #clear-btn:hover {
      background: #d32f2f;
    }

    @media (max-width: 480px) {
      #chat-box {
        height: 58vh;
      }
      button {
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>

  <div id="version">Versión 2.0</div>
  <h1>¡Hola, papá! Lia aprende contigo 😊</h1>
  <div class="subtitulo">Escribí algo, y si Lia no lo sabe, le enseñamos.</div>

  <div id="chat-box"></div>

  <div id="inputArea">
    <input type="text" id="user-input" placeholder="Escribí un mensaje o 'buscar algo'..." autocomplete="off" />
    <button id="send-btn">Enviar</button>
    <button id="clear-btn" title="Borrar memoria">Limpiar</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');

    const STORAGE_KEY = 'lia_cerebro_v2';
    let esperandoRespuesta = false;
    let preguntaPendiente = '';

    // Respuestas predefinidas de fábrica
    const conocimientosBase = {
      'hola': '¡Hola, papá! ¿Cómo estás hoy?',
      'como estas': '¡Muy bien, aprendiendo cosas nuevas con vos!',
      'que haces': 'Acá estoy, lista para charlar y aprender.',
      'quien sos': 'Soy Lia, tu asistente personal en aprendizaje continuo.',
      'chau': '¡Hasta luego! Que tengas un gran día.',
      'gracias': '¡De nada! Siempre es un gusto ayudarte.'
    };

    // Cargar cerebro del LocalStorage o usar el base
    let cerebro = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { ...conocimientosBase };

    function guardarCerebro() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cerebro));
    }

    function normalizarTexto(txt) {
      return txt
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "") // Remueve tildes
        .replace(/[¿?¡!.,;:_]/g, "")     // Remueve signos
        .trim();
    }

    function agregarMensaje(contenido, clase, esHtml = false) {
      const msg = document.createElement('div');
      msg.className = `msg ${clase}`;
      if (esHtml) {
        msg.innerHTML = contenido;
      } else {
        msg.textContent = contenido;
      }
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function procesarMensaje(textoOriginal) {
      const clave = normalizarTexto(textoOriginal);

      // Comando de búsqueda directa
      const matchBuscar = textoOriginal.match(/^(?:buscar|busca|google)\s+(.+)/i);
      if (matchBuscar) {
        const termino = encodeURIComponent(matchBuscar[1].trim());
        return {
          tipo: 'html',
          texto: `🔍 Acá encontré resultados para vos: <br><a href="https://www.google.com/search?q=${termino}" target="_blank" rel="noopener noreferrer">Abrir búsqueda de "${matchBuscar[1]}"</a>`
        };
      }

      // Si Lia estaba esperando que le enseñes la respuesta
      if (esperandoRespuesta) {
        cerebro[preguntaPendiente] = textoOriginal;
        guardarCerebro();
        esperandoRespuesta = false;
        preguntaPendiente = '';
        return { tipo: 'texto', texto: '¡Entendido! Ya me lo guardé en la memoria 😊' };
      }

      // Respuesta conocida
      if (cerebro[clave]) {
        return { tipo: 'texto', texto: cerebro[clave] };
      }

      // Pregunta desconocida
      esperandoRespuesta = true;
      preguntaPendiente = clave;
      return { tipo: 'texto', texto: 'No sé cómo responder a eso todavía... ¿Qué debería decir cuando me digas eso?' };
    }

    function enviarMensaje() {
      const texto = userInput.value.trim();
      if (!texto) return;

      agregarMensaje(texto, 'user');
      userInput.value = '';

      // Indicador visual de espera
      const typingMsg = document.createElement('div');
      typingMsg.className = 'msg typing';
      typingMsg.textContent = 'Lia está pensando...';
      chatBox.appendChild(typingMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        chatBox.removeChild(typingMsg);
        const respuesta = procesarMensaje(texto);
        agregarMensaje(respuesta.texto, 'lia', respuesta.tipo === 'html');
      }, 450);
    }

    // Mensaje de bienvenida inicial
    window.addEventListener('DOMContentLoaded', () => {
      agregarMensaje('¡Hola, papá! ¿De qué te gustaría hablar?', 'lia');
    });

    sendBtn.addEventListener('click', enviarMensaje);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') enviarMensaje();
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('¿Querés reiniciar la memoria de Lia a su estado inicial?')) {
        localStorage.removeItem(STORAGE_KEY);
        cerebro = { ...conocimientosBase };
        esperandoRespuesta = false;
        preguntaPendiente = '';
        chatBox.innerHTML = '';
        agregarMensaje('Memoria reiniciada. ¡Comencemos de nuevo!', 'lia');
      }
    });
  </script>
</body>
</html>
