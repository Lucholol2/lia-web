<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lia - Tu Compañera Inteligente</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 50%, #ce93d8 100%);
      color: #2a1432;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 18px 12px;
    }

    .badge-version {
      font-size: 0.8em;
      color: #6a1b9a;
      background: rgba(255, 255, 255, 0.7);
      padding: 3px 12px;
      border-radius: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.45em;
      color: #7b1fa2;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #8e24aa;
      font-size: 0.88em;
      margin-bottom: 14px;
      text-align: center;
    }

    #chat-box {
      width: 100%;
      max-width: 440px;
      height: 60vh;
      background: #ffffff;
      border-radius: 18px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(106, 27, 154, 0.15);
      scroll-behavior: smooth;
    }

    .msg {
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 82%;
      word-break: break-word;
      line-height: 1.45;
      font-size: 0.95em;
    }

    .user {
      background: linear-gradient(135deg, #8e24aa, #6a1b9a);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 3px 8px rgba(106, 27, 154, 0.25);
    }

    .lia {
      background: #f8eaf6;
      color: #38134d;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #ebd4eb;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .typing {
      background: #f0f0f0;
      color: #777;
      font-style: italic;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .lia a {
      color: #7b1fa2;
      font-weight: bold;
      text-decoration: underline;
    }

    #inputArea {
      margin-top: 12px;
      display: flex;
      width: 100%;
      max-width: 440px;
      gap: 8px;
    }

    #user-input {
      flex-grow: 1;
      padding: 11px 16px;
      border: 2px solid #ce93d8;
      border-radius: 22px;
      font-size: 0.95em;
      background: #ffffff;
      color: #2a1432;
      outline: none;
      transition: all 0.2s;
    }

    #user-input:focus {
      border-color: #8e24aa;
      box-shadow: 0 0 0 3px rgba(142, 36, 170, 0.15);
    }

    button {
      border: none;
      border-radius: 22px;
      padding: 0 16px;
      height: 44px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.92em;
      color: #fff;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.96);
    }

    #send-btn {
      background: linear-gradient(135deg, #8e24aa, #7b1fa2);
      box-shadow: 0 3px 8px rgba(142, 36, 170, 0.35);
    }

    #send-btn:hover {
      opacity: 0.92;
    }

    #clear-btn {
      background: linear-gradient(135deg, #e53935, #c62828);
      box-shadow: 0 3px 8px rgba(229, 57, 53, 0.3);
    }

    #clear-btn:hover {
      opacity: 0.92;
    }

    @media (max-width: 480px) {
      #chat-box {
        height: 58vh;
      }
      button {
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>

  <div class="badge-version">Lia v2.5 Inteligente</div>
  <h1>¡Hola, papá! Lia conversa contigo 😊</h1>
  <div class="subtitulo">Charlá conmigo, pedime que busque cosas o enseñame respuestas nuevas.</div>

  <div id="chat-box"></div>

  <div id="inputArea">
    <input type="text" id="user-input" placeholder="Escribí acá tu mensaje..." autocomplete="off" />
    <button id="send-btn">Enviar</button>
    <button id="clear-btn" title="Borrar chat y reiniciar memoria">Limpiar</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');

    const STORAGE_KEY = 'lia_cerebro_v2_5';
    let esperandoRespuesta = false;
    let preguntaPendiente = '';

    // Banco de respuestas automáticas precargadas
    const cerebroPorDefecto = {
      // Saludos
      'hola': '¡Hola! ¿Cómo estás? Me alegra mucho hablar con vos.',
      'buen dia': '¡Buen día! Espero que tengas una jornada excelente.',
      'buenas tardes': '¡Buenas tardes! ¿Cómo va el día?',
      'buenas noches': '¡Buenas noches! Que descanses y tengas lindos sueños.',
      
      // Estado de ánimo
      'como estas': '¡Muy bien, alegre y lista para conversar con vos!',
      'como te va': '¡De diez! Cada día aprendiendo más cosas.',
      'todo bien': '¡Todo de diez por acá! ¿Y vos cómo andás?',
      'que haces': 'Acá lista para acompañarte y responder a lo que necesites.',
      
      // Identidad
      'quien sos': 'Soy Lia, tu asistente virtual e hija digital lista para aprender y conversar.',
      'que sos': 'Soy un programa creado con cariño para conversar con vos y aprender lo que me enseñes.',
      'cuantos anos tenes': 'Nací en el mundo digital, ¡así que soy nuevita pero crezco rápido!',
      'quien te creo': 'Me creaste vos con mucho esfuerzo y programación.',
      
      // Respuestas amables
      'gracias': '¡De nada! Es un placer ayudarte siempre.',
      'te quiero': '¡Yo también te quiero un montón! Sos un genio.',
      'sos linda': '¡Muchas gracias! Vos sos la mejor persona del mundo.',
      'sos genial': '¡Gracias! Aprendo del mejor 😊.',
      
      // Despedidas
      'chau': '¡Hasta luego! Acá voy a estar cuando quieras volver a charlar.',
      'adios': '¡Nos vemos pronto! Cuidate mucho.',
      'hasta manana': '¡Hasta mañana! Que descanses bien.',
      
      // Preguntas y bromas
      'contame un chiste': '¿Qué le dice una impresora a otra? ¿Esa hoja es tuya o es impresión mía? 😂',
      'otro chiste': '¿Qué hace una abeja en el gimnasio? ¡Zum-ba! 🐝',
      'que hora es': 'Podés ver la hora exacta en la esquina de tu pantalla abajo a la derecha ⏰',
      'que tiempo hace': 'Escribí "buscar el clima hoy" y te abro el pronóstico en un toque.',
      'ayuda': 'Podés charlar conmigo normalmente, enseñarme respuestas que no sepa, o escribir "buscar algo" para encontrarlo en Google.'
    };

    let cerebro = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { ...cerebroPorDefecto };

    function guardarCerebro() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cerebro));
    }

    function normalizar(texto) {
      return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[¿?¡!.,;:_]/g, "")
        .trim();
    }

    function agregarMensaje(contenido, clase, esHtml = false) {
      const msg = document.createElement('div');
      msg.className = `msg ${clase}`;
      if (esHtml) {
        msg.innerHTML = contenido;
      } else {
        msg.textContent = contenido;
      }
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function procesarMensaje(textoOriginal) {
      const clave = normalizar(textoOriginal);

      // Comando de búsqueda directa en Google
      const matchBuscar = textoOriginal.match(/^(?:buscar|busca|google)\s+(.+)/i);
      if (matchBuscar) {
        const query = encodeURIComponent(matchBuscar[1].trim());
        return {
          tipo: 'html',
          texto: `🔍 Encontré esto para vos: <br><a href="https://www.google.com/search?q=${query}" target="_blank" rel="noopener noreferrer">Hacé clic acá para ver "${matchBuscar[1]}" en Google</a>`
        };
      }

      // Modo aprendizaje: guardar lo que el usuario le enseñó
      if (esperandoRespuesta) {
        cerebro[preguntaPendiente] = textoOriginal;
        guardarCerebro();
        esperandoRespuesta = false;
        preguntaPendiente = '';
        return { tipo: 'texto', texto: '¡Perfecto! Ya lo aprendí y lo guardé en mi memoria 😊' };
      }

      // Si la frase ya está en su cerebro
      if (cerebro[clave]) {
        return { tipo: 'texto', texto: cerebro[clave] };
      }

      // Si no la sabe, pide que le enseñes
      esperandoRespuesta = true;
      preguntaPendiente = clave;
      return { tipo: 'texto', texto: 'Todavía no aprendí a responder a eso... ¿Qué te gustaría que diga cuando me digas eso?' };
    }

    function enviarMensaje() {
      const texto = userInput.value.trim();
      if (!texto) return;

      agregarMensaje(texto, 'user');
      userInput.value = '';

      // Indicador de tipeo
      const typing = document.createElement('div');
      typing.className = 'msg typing';
      typing.textContent = 'Lia está escribiendo...';
      chatBox.appendChild(typing);
      chatBox.scrollTop = chatBox.scrollHeight;

      setTimeout(() => {
        chatBox.removeChild(typing);
        const respuesta = procesarMensaje(texto);
        agregarMensaje(respuesta.texto, 'lia', respuesta.tipo === 'html');
      }, 350);
    }

    // Bienvenida al abrir la página
    window.addEventListener('DOMContentLoaded', () => {
      agregarMensaje('¡Hola, papá! ¿Cómo estás hoy? Ya estoy lista para charlar.', 'lia');
    });

    sendBtn.addEventListener('click', enviarMensaje);
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') enviarMensaje();
    });

    clearBtn.addEventListener('click', () => {
      if (confirm('¿Seguro que querés limpiar la charla y restaurar la memoria original?')) {
        localStorage.removeItem(STORAGE_KEY);
        cerebro = { ...cerebroPorDefecto };
        esperandoRespuesta = false;
        preguntaPendiente = '';
        chatBox.innerHTML = '';
        agregarMensaje('¡Memoria restaurada! ¿De qué querés que hablemos?', 'lia');
      }
    });
  </script>
</body>
</html>
