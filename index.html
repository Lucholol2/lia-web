<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lia - Asistente con Voz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: linear-gradient(135deg, #f3e5f5, #ce93d8); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px; }
    
    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    h1 { color: #6a1b9a; font-size: 1.25em; }
    .voice-toggle {
      background: #ffffff;
      border: 1px solid #ce93d8;
      border-radius: 16px;
      padding: 4px 10px;
      font-size: 0.85em;
      cursor: pointer;
      font-weight: 600;
      color: #6a1b9a;
    }

    #chat {
      width: 100%;
      max-width: 440px;
      height: 60vh;
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .msg { padding: 10px 14px; border-radius: 16px; max-width: 82%; font-size: 0.95em; line-height: 1.4; word-break: break-word; }
    .user { background: #8e24aa; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .lia { background: #f3e5f5; color: #3d176a; align-self: flex-start; border-bottom-left-radius: 4px; }
    .lia a { color: #6a1b9a; font-weight: bold; }

    .bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #ce93d8;
      border-radius: 20px;
      outline: none;
      font-size: 0.95em;
    }
    input:focus { border-color: #8e24aa; }

    .action-btn {
      border: none;
      border-radius: 20px;
      height: 42px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, opacity 0.2s;
    }
    .action-btn:active { transform: scale(0.95); }

    #mic-btn {
      background: #ffffff;
      border: 2px solid #8e24aa;
      color: #8e24aa;
      width: 42px;
      font-size: 1.1em;
    }
    #mic-btn.listening {
      background: #e53935;
      color: #fff;
      border-color: #e53935;
      animation: pulse 1s infinite alternate;
    }

    #send-btn {
      background: #8e24aa;
      color: #fff;
      padding: 0 16px;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Lia - Asistente con Voz 🎙️</h1>
    <button id="toggle-voice" class="voice-toggle">Voz: Activada 🔊</button>
  </div>

  <div id="chat"></div>

  <div class="bar">
    <button id="mic-btn" class="action-btn" title="Hablar por micrófono">🎙️</button>
    <input type="text" id="txt" placeholder="Escribí o tocá el micrófono..." autocomplete="off" />
    <button id="send-btn" class="action-btn">Enviar</button>
  </div>

  <script>
    const box = document.getElementById('chat');
    const input = document.getElementById('txt');
    const sendBtn = document.getElementById('send-btn');
    const micBtn = document.getElementById('mic-btn');
    const toggleVoiceBtn = document.getElementById('toggle-voice');

    let vozHabilitada = true;

    // Cambiar estado de la voz
    toggleVoiceBtn.addEventListener('click', () => {
      vozHabilitada = !vozHabilitada;
      toggleVoiceBtn.textContent = vozHabilitada ? 'Voz: Activada 🔊' : 'Voz: Silencio 🔇';
      if (!vozHabilitada) window.speechSynthesis.cancel();
    });

    // Función para que Lia hable
    function hablar(texto) {
      if (!vozHabilitada || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // Detiene audios previos

      // Limpia enlaces o etiquetas HTML antes de pronunciarlo
      const textoLimpio = texto.replace(/<[^>]*>/g, '').replace(/https?:\/\/\S+/g, '');
      const utterance = new SpeechSynthesisUtterance(textoLimpio);
      utterance.lang = 'es-AR'; // Español rioplatense / general
      utterance.rate = 1.0;     // Velocidad normal
      utterance.pitch = 1.1;    // Tono ligeramente amigable

      window.speechSynthesis.speak(utterance);
    }

    // Reconocimiento de voz (Micrófono)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-AR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        micBtn.classList.add('listening');
        input.placeholder = 'Escuchando tu voz...';
      };

      recognition.onresult = (event) => {
        const vozTexto = event.results[0][0].transcript;
        input.value = vozTexto;
        enviar();
      };

      recognition.onend = () => {
        micBtn.classList.remove('listening');
        input.placeholder = 'Escribí o tocá el micrófono...';
      };

      recognition.onerror = () => {
        micBtn.classList.remove('listening');
        input.placeholder = 'No se pudo escuchar. Probá de nuevo.';
      };

      micBtn.addEventListener('click', () => {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      });
    } else {
      micBtn.style.display = 'none'; // Oculta botón si el navegador no lo soporta
    }

    function ponerMensaje(texto, tipo, esHtml = false) {
      const d = document.createElement('div');
      d.className = `msg ${tipo}`;
      if (esHtml) d.innerHTML = texto;
      else d.textContent = texto;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }

    async function obtenerClima() {
      try {
        const res = await fetch('https://wttr.in/?format=j1');
        const data = await res.json();
        const actual = data.current_condition[0];
        const temp = actual.temp_C;
        const sensacion = actual.FeelsLikeC;
        const ciudad = data.nearest_area[0].areaName[0].value;
        return `El clima en ${ciudad} es de ${temp} grados, con sensación térmica de ${sensacion} grados.`;
      } catch (e) {
        return 'Podés ver el pronóstico del clima tocando acá: <a href="https://www.google.com/search?q=clima+hoy" target="_blank">Ver Clima</a>';
      }
    }

    async function responder(texto) {
      const t = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

      if (/clima|temperatura|tiempo|llueve|frio|calor/.test(t)) {
        const climaTxt = await obtenerClima();
        return { texto: climaTxt, esHtml: climaTxt.includes('<a') };
      }
      if (/hora/.test(t)) {
        const ahora = new Date();
        const hora = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return { texto: `Son las ${hora}.`, esHtml: false };
      }
      if (/dia|fecha/.test(t)) {
        const fecha = new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
        return { texto: `Hoy es ${fecha}.`, esHtml: false };
      }
      if (/hola|buen dia|buenas/.test(t)) return { texto: "¡Hola! ¿Cómo estás hoy?", esHtml: false };
      if (/como estas|todo bien/.test(t)) return { texto: "¡Todo muy bien! Contento de charlar con vos.", esHtml: false };
      if (/chiste/.test(t)) return { texto: "¿Qué le dice una taza a otra? ¿Qué taza ciendo? ¡Ja, ja, ja!", esHtml: false };
      if (/te quiero|genia/.test(t)) return { texto: "¡Muchas gracias! Yo también te quiero un montón.", esHtml: false };
      if (/chau|adios|hasta luego/.test(t)) return { texto: "¡Hasta luego! Cuidate mucho.", esHtml: false };

      const query = encodeURIComponent(texto);
      return {
        texto: `No estoy segura de eso todavía, pero podés mirarlo acá: <a href="https://www.google.com/search?q=${query}" target="_blank">Buscar en Google 🔍</a>`,
        esHtml: true
      };
    }

    async function enviar() {
      const v = input.value.trim();
      if (!v) return;
      ponerMensaje(v, 'user');
      input.value = '';

      const resp = await responder(v);
      ponerMensaje(resp.texto, 'lia', resp.esHtml);
      hablar(resp.texto);
    }

    sendBtn.addEventListener('click', enviar);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });

    window.onload = () => {
      const bienvenida = "¡Hola, papá! Ya puedo hablarte en voz alta y escuchar tu micrófono.";
      ponerMensaje(bienvenida, "lia");
    };
  </script>
</body>
</html>
