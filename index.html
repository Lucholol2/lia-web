<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #e1bee7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; }
    .top { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    h1 { color: #4a148c; font-size: 1.1em; }
    #chat { width: 100%; max-width: 400px; height: 58vh; background: #fff; border-radius: 14px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 14px; max-width: 85%; font-size: 0.9em; word-break: break-word; }
    .user { background: #8e24aa; color: #fff; align-self: flex-end; }
    .lia { background: #f3e5f5; color: #3d176a; align-self: flex-start; }
    .img-box { margin-top: 6px; border-radius: 8px; overflow: hidden; border: 1px solid #ce93d8; }
    .img-box img { width: 100%; max-height: 220px; object-fit: cover; display: block; }
    .img-box a { display: block; background: #8e24aa; color: #fff; text-align: center; padding: 5px; font-size: 0.75em; text-decoration: none; font-weight: bold; }
    #chips { width: 100%; max-width: 400px; display: flex; gap: 5px; margin: 6px 0; overflow-x: auto; }
    .chip { background: #fff; color: #6a1b9a; border: 1px solid #ce93d8; border-radius: 12px; padding: 3px 8px; font-size: 0.8em; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .bar { width: 100%; max-width: 400px; display: flex; gap: 5px; }
    input { flex: 1; padding: 8px 12px; border: 2px solid #ce93d8; border-radius: 18px; outline: none; }
    button { border: none; border-radius: 18px; background: #8e24aa; color: #fff; font-weight: bold; cursor: pointer; padding: 0 12px; height: 36px; }
    #mic.on { background: #e53935; }
  </style>
</head>
<body>

  <div class="top">
    <h1>Lia Asistente 🎨🎙️</h1>
    <button id="tog" style="font-size:0.75em; background:#fff; color:#4a148c; border:1px solid #ce93d8;">Voz: ON 🔊</button>
  </div>

  <div id="chat"></div>
  <div id="chips"></div>

  <div class="bar">
    <button id="mic" style="background:#fff; color:#8e24aa; border:2px solid #8e24aa;">🎙️</button>
    <input type="text" id="txt" placeholder="Escribí o pedí 'dibujá un...'" autocomplete="off" />
    <button id="send">Enviar</button>
  </div>

  <script>
    const box = document.getElementById('chat'), txt = document.getElementById('txt'), send = document.getElementById('send');
    const mic = document.getElementById('mic'), tog = document.getElementById('tog'), chips = document.getElementById('chips');
    let voz = true, rec = null;
    const palabras = ["hola", "clima", "hora", "chiste", "dibujá un martillo", "dibujá un gato", "dibujá un mate"];

    tog.onclick = () => { voz = !voz; tog.textContent = voz ? 'Voz: ON 🔊' : 'Voz: OFF 🔇'; if (!voz) speechSynthesis.cancel(); };

    function hablar(t) {
      if (!voz || !('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g, ''));
      u.lang = 'es-AR';
      speechSynthesis.speak(u);
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      rec = new SR(); rec.lang = 'es-AR';
      rec.onstart = () => mic.classList.add('on');
      rec.onend = () => mic.classList.remove('on');
      rec.onresult = e => { txt.value = e.results[0][0].transcript; enviar(); };
      mic.onclick = () => { try { rec.start(); } catch(e) { rec.stop(); } };
    } else { mic.style.display = 'none'; }

    function poner(t, tipo, html = false) {
      const d = document.createElement('div');
      d.className = `msg ${tipo}`;
      html ? d.innerHTML = t : d.textContent = t;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }

    function pintarChips() {
      chips.innerHTML = '';
      const v = txt.value.trim().toLowerCase();
      const lista = v ? palabras.filter(p => p.includes(v)).slice(0, 4) : ["hola", "clima", "chiste", "dibujá un martillo"];
      lista.forEach(p => {
        const c = document.createElement('div'); c.className = 'chip'; c.textContent = p;
        c.onclick = () => { txt.value = p; txt.focus(); pintarChips(); };
        chips.appendChild(c);
      });
    }

    async function responder(t) {
      const limpio = t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

      // Generar imagen con traducción automática de palabras clave
      const m = t.match(/^(?:dibuja|dibujá|genera|generá|crea|creá|imagen de)\s+(.+)/i);
      if (m) {
        let p = m[1].trim().toLowerCase();
        const dic = { 'martillo': 'tool hammer', 'un martillo': 'tool hammer', 'mate': 'yerba mate drink', 'gato': 'cat', 'perro': 'dog', 'auto': 'car' };
        const q = encodeURIComponent(dic[p] || p);
        const url = `https://image.pollinations.ai/p/${q}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random()*9999)}`;
        return {
          t: `🎨 Acá tenés "${m[1]}":<div class="img-box"><img src="${url}"><a href="${url}" target="_blank">Ver grande 🔍</a></div>`,
          h: true, voz: '¡Hecho! Acá tenés el dibujo.'
        };
      }

      if (/clima|temperatura/.test(limpio)) {
        try {
          const r = await fetch('https://wttr.in/?format=j1');
          const d = await r.json();
          const c = d.current_condition[0];
          return { t: `El clima en ${d.nearest_area[0].areaName[0].value} es ${c.temp_C}°C (sensación ${c.FeelsLikeC}°C).`, h: false };
        } catch { return { t: 'No pude obtener el clima.', h: false }; }
      }
      if (/hora/.test(limpio)) return { t: `Son las ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}.`, h: false };
      if (/hola|buen dia/.test(limpio)) return { t: '¡Hola, papá! ¿Cómo andás?', h: false };
      if (/como estas|todo bien/.test(limpio)) return { t: '¡Todo perfecto por acá! ¿Y vos?', h: false };
      if (/chiste/.test(limpio)) return { t: '¿Qué hace una abeja en el gym? ¡Zum-ba! 😂', h: false };

      return { t: `Podés buscarlo acá: <a href="https://www.google.com/search?q=${encodeURIComponent(t)}" target="_blank" style="color:#6a1b9a;font-weight:bold;">Buscar en Google 🔍</a>`, h: true };
    }

    async function enviar() {
      const v = txt.value.trim();
      if (!v) return;
      poner(v, 'user');
      txt.value = '';
      pintarChips();

      const r = await responder(v);
      poner(r.t, 'lia', r.h);
      hablar(r.voz || r.t);
    }

    txt.oninput = pintarChips;
    send.onclick = enviar;
    txt.onkeydown = e => { if (e.key === 'Enter') enviar(); };
    window.onload = () => { pintarChips(); poner("¡Hola, papá! Ya podés pedirme que dibuje lo que quieras.", "lia"); };
  </script>
</body>
</html>
