<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lia - Compañera Virtual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: linear-gradient(135deg, #f3e5f5, #ce93d8); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
    h1 { color: #6a1b9a; font-size: 1.3em; margin: 6px 0; }
    #chat { width: 100%; max-width: 440px; height: 65vh; background: #fff; border-radius: 16px; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .msg { padding: 10px 14px; border-radius: 16px; max-width: 82%; font-size: 0.95em; line-height: 1.4; word-break: break-word; }
    .user { background: #8e24aa; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .lia { background: #f3e5f5; color: #3d176a; align-self: flex-start; border-bottom-left-radius: 4px; }
    .lia a { color: #6a1b9a; font-weight: bold; }
    .bar { width: 100%; max-width: 440px; display: flex; gap: 8px; margin-top: 10px; }
    input { flex: 1; padding: 10px 14px; border: 2px solid #ce93d8; border-radius: 20px; outline: none; }
    input:focus { border-color: #8e24aa; }
    button { padding: 0 18px; border: none; border-radius: 20px; background: #8e24aa; color: #fff; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <h1>Lia - Compañera Virtual 😊</h1>
  <div id="chat"></div>

  <div class="bar">
    <input type="text" id="txt" placeholder="Escribí acá (ej: clima, hora, un chiste)..." autocomplete="off" />
    <button id="btn">Enviar</button>
  </div>

  <script>
    const box = document.getElementById('chat'), input = document.getElementById('txt'), btn = document.getElementById('btn');

    function ponerMensaje(texto, tipo, esHtml = false) {
      const d = document.createElement('div');
      d.className = `msg ${tipo}`;
      if (esHtml) d.innerHTML = texto;
      else d.textContent = texto;
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }

    async function obtenerClima() {
      try {
        const res = await fetch('https://wttr.in/?format=j1');
        const data = await res.json();
        const actual = data.current_condition[0];
        const temp = actual.temp_C;
        const sensacion = actual.FeelsLikeC;
        const ciudad = data.nearest_area[0].areaName[0].value;
        return `🌡️ El clima en ${ciudad} es de ${temp}°C (sensación térmica de ${sensacion}°C).`;
      } catch (e) {
        return '☀️ Podés consultar el clima actual al instante tocando acá: <a href="https://www.google.com/search?q=clima+hoy" target="_blank">Ver el pronóstico del clima</a>';
      }
    }

    async function responder(texto) {
      const t = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();

      // Consulta del clima en tiempo real
      if (/clima|temperatura|tiempo|llueve|frio|calor/.test(t)) {
        return { texto: await obtenerClima(), esHtml: true };
      }

      // Consulta de hora
      if (/hora/.test(t)) {
        const ahora = new Date();
        const hora = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return { texto: `Son las ${hora} ⏰`, esHtml: false };
      }

      // Consulta de fecha
      if (/dia es|fecha|que dia/.test(t)) {
        const fecha = new Date().toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
        return { texto: `Hoy es ${fecha}.`, esHtml: false };
      }

      // Saludos y conversación familiar
      if (/hola|buen dia|buenas|que tal/.test(t)) return { texto: "¡Hola, papá! ¿Cómo andás?", esHtml: false };
      if (/como estas|como te va|todo bien/.test(t)) return { texto: "¡Todo muy bien! Disfrutando de charlar con vos 😊", esHtml: false };
      if (/que haces|que contas/.test(t)) return { texto: "Acá estoy, lista para darte una mano con lo que necesites.", esHtml: false };
      if (/quien sos|como te llamas/.test(t)) return { texto: "Soy Lia, tu compañera virtual.", esHtml: false };
      if (/te quiero|sos linda|genia/.test(t)) return { texto: "¡Muchas gracias! Vos sos el mejor papá ❤️", esHtml: false };
      if (/chiste/.test(t)) return { texto: "¿Qué le dice un jardinero a otro? Nos vemos cuando podamos. 😂", esHtml: false };

      // Búsqueda en Google si no entiende la pregunta
      const query = encodeURIComponent(texto);
      return {
        texto: `No estoy segura de eso todavía, pero podés mirarlo acá: <a href="https://www.google.com/search?q=${query}" target="_blank">Buscar "${texto}" en Google 🔍</a>`,
        esHtml: true
      };
    }

    async function enviar() {
      const v = input.value.trim();
      if (!v) return;
      ponerMensaje(v, 'user');
      input.value = '';

      const resp = await responder(v);
      ponerMensaje(resp.texto, 'lia', resp.esHtml);
    }

    btn.addEventListener('click', enviar);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') enviar(); });
    window.onload = () => ponerMensaje("¡Hola, papá! Ya puedo decirte la hora, el clima real o buscar lo que quieras.", "lia");
  </script>
</body>
</html>
